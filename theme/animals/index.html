<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<title>Shadow Matching</title>

<style>
:root{
    --app-height: 100dvh;
    --dock-height: clamp(138px, 24dvh, 190px);
    --brown: #7b4b22;
    --cream: #fff4c7;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body{
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    font-family: Arial, sans-serif;
    background: #73c04b;
}

body{
    position: fixed;
    inset: 0;
}

button,
img{
    -webkit-user-drag: none;
}

/* SPLASH SCREEN */
#splash-screen{
    position: fixed;
    inset: 0;
    width: 100%;
    height: var(--app-height);
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
}

#splash-screen img{
    width: min(220px, 72vw);
    height: auto;
}

/* MAIN GAME */
#game-container{
    position: relative;
    width: min(100vw, 760px);
    height: var(--app-height);
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) var(--dock-height);
    overflow: hidden;
    background: #73c04b;
}

#header{
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    padding:
        max(10px, env(safe-area-inset-top))
        12px
        8px;
    background: #8fd8ff;
}

#title{
    max-width: 94%;
    background: var(--cream);
    border: clamp(3px, 0.8vw, 5px) solid var(--brown);
    border-radius: 999px;
    padding: clamp(7px, 1.4vh, 12px) clamp(20px, 6vw, 38px);
    font-size: clamp(1.35rem, 5.2vw, 2.15rem);
    line-height: 1.08;
    font-weight: 800;
    color: var(--brown);
    text-align: center;
    white-space: nowrap;
}

#play-area{
    position: relative;
    min-height: 0;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #8fd8ff 0%,
            #8fd8ff 58%,
            #73c04b 58%,
            #64ad3c 100%
        );
}

/* SHADOW AREA */
#target-area{
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    align-items: center;
    justify-items: center;
    gap: clamp(2px, 1vw, 10px);
    padding:
        clamp(4px, 1vh, 12px)
        clamp(8px, 2vw, 18px)
        clamp(95px, 17vh, 145px);
    z-index: 3;
}

.shadow{
    width: clamp(64px, 20vw, 116px);
    height: clamp(64px, 15vh, 116px);
    object-fit: contain;
    filter: brightness(0);
    opacity: 0.78;
    transition: transform 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
    pointer-events: none;
}

#shadow-Horse{
    width: clamp(78px, 23vw, 132px);
    height: clamp(78px, 17vh, 132px);
}

.shadow.matched{
    filter: none;
    opacity: 1;
    transform: scale(1.05);
}

/* FARMHOUSE */
#farmhouse{
    position: absolute;
    right: clamp(8px, 2vw, 18px);
    bottom: clamp(8px, 1.5vh, 16px);
    width: clamp(100px, 27vw, 160px);
    aspect-ratio: 1.1 / 1;
    z-index: 2;
    pointer-events: none;
}

#roof{
    position: absolute;
    top: 0;
    left: 6%;
    width: 88%;
    height: 43%;
    background: #8b2f16;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}

#house-body{
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 67%;
    background: #b96b32;
    border: clamp(3px, 0.8vw, 5px) solid #63330f;
    border-radius: 5px;
}

#door{
    position: absolute;
    left: 34%;
    bottom: 0;
    width: 35%;
    height: 72%;
    background: #5b2c0c;
    border: clamp(3px, 0.7vw, 4px) solid #3b1a05;
}

#door::before,
#door::after{
    content: "";
    position: absolute;
    left: 0;
    top: 30%;
    width: 100%;
    height: clamp(3px, 0.7vw, 4px);
    background: #d9b07a;
    transform-origin: center;
}

#door::before{
    transform: rotate(35deg);
}

#door::after{
    transform: rotate(-35deg);
}

/* ANIMAL DOCK */
#dock{
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    align-items: center;
    justify-items: center;
    gap: 2px clamp(6px, 2vw, 14px);
    padding:
        clamp(7px, 1vh, 11px)
        clamp(8px, 2vw, 14px)
        max(clamp(7px, 1vh, 11px), env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.17);
    border-top: clamp(3px, 0.8vw, 5px) dashed #ffffff;
}

.animal{
    width: clamp(56px, 18vw, 84px);
    height: clamp(56px, 9.5vh, 84px);
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    touch-action: none;
    cursor: grab;
    z-index: 50;
}

.animal:active{
    cursor: grabbing;
}

.dragging{
    position: fixed !important;
    z-index: 5000 !important;
    pointer-events: none !important;
    margin: 0 !important;
    transform: scale(1.08);
    filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.22));
}

/* WIN SCREEN */
#win-screen{
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.94);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
    text-align: center;
    z-index: 999;
}

#win-screen h1{
    font-size: clamp(2rem, 9vw, 3.2rem);
    color: #ff4747;
}

#win-screen button{
    min-width: 180px;
    padding: 14px 28px;
    font-size: clamp(1rem, 4.5vw, 1.3rem);
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    background: #2ecc71;
    color: #ffffff;
    cursor: pointer;
}

/* Very short screens: reduce the title and dock slightly */
@media (max-height: 620px){
    :root{
        --dock-height: 128px;
    }

    #header{
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: 5px;
    }

    #title{
        padding-top: 6px;
        padding-bottom: 6px;
        font-size: 1.2rem;
    }

    #target-area{
        padding-bottom: 82px;
    }

    .shadow{
        width: 58px;
        height: 58px;
    }

    #shadow-Horse{
        width: 70px;
        height: 70px;
    }

    .animal{
        width: 52px;
        height: 52px;
    }
}

/* Wider screens: display all six animals in one row */
@media (min-width: 701px){
    :root{
        --dock-height: 150px;
    }

    #dock{
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: 1fr;
    }

    #target-area{
        padding-bottom: 120px;
    }
}
</style>
</head>

<body>

<div id="splash-screen">
    <img src="./assets/innovine-logo.png" alt="Innovine Logo">
</div>

<audio id="correctSound" src="./assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="./assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<div id="game-container">

    <header id="header">
        <div id="title">Shadow Matching</div>
    </header>

    <main id="play-area">
        <div id="target-area">
            <img id="shadow-Pig" class="shadow" data-animal="Pig" src="./assets/Pig.png" alt="Pig shadow">
            <img id="shadow-Horse" class="shadow" data-animal="Horse" src="./assets/Horse.png" alt="Horse shadow">
            <img id="shadow-Cow" class="shadow" data-animal="Cow" src="./assets/Cow.png" alt="Cow shadow">
            <img id="shadow-Hen" class="shadow" data-animal="Hen" src="./assets/Hen.png" alt="Hen shadow">
            <img id="shadow-Duck" class="shadow" data-animal="Duck" src="./assets/Duck.png" alt="Duck shadow">
            <img id="shadow-Sheep" class="shadow" data-animal="Sheep" src="./assets/Sheep.png" alt="Sheep shadow">
        </div>

        <div id="farmhouse" aria-hidden="true">
            <div id="roof"></div>
            <div id="house-body">
                <div id="door"></div>
            </div>
        </div>
    </main>

    <div id="dock" aria-label="Animals to match"></div>

    <div id="win-screen">
        <h1>WELL DONE! 🎉</h1>
        <button type="button" onclick="resetGame()">Play Again</button>
    </div>

</div>

<script>
const animals = ["Cow", "Duck", "Hen", "Horse", "Pig", "Sheep"];
let matched = 0;
let draggingNow = false;

function setAppHeight(){
    if (draggingNow) return;
    document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
}

setAppHeight();
window.addEventListener("resize", setAppHeight);
window.addEventListener("orientationchange", () => setTimeout(setAppHeight, 150));

window.addEventListener("load", () => {
    setAppHeight();
    createAnimals();

    setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
        }, 500);
    }, 3000);
});

function playSound(id){
    const sound = document.getElementById(id);
    if (!sound) return;

    sound.pause();
    sound.currentTime = 0;
    sound.play().catch(() => {
        /* Mobile browsers allow sound after the first user interaction. */
    });
}

function shuffledCopy(array){
    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function createAnimals(){
    matched = 0;
    draggingNow = false;

    document.getElementById("win-screen").style.display = "none";

    const dock = document.getElementById("dock");
    dock.innerHTML = "";

    document.querySelectorAll(".shadow").forEach((shadow) => {
        shadow.classList.remove("matched");
        shadow.src = `./assets/${shadow.dataset.animal}.png`;
    });

    shuffledCopy(animals).forEach((animal) => {
        const img = document.createElement("img");
        img.src = `./assets/${animal}.png`;
        img.className = "animal";
        img.dataset.animal = animal;
        img.alt = animal;
        img.draggable = false;
        dock.appendChild(img);
        enableDrag(img);
    });
}

function enableDrag(el){
    let offsetX = 0;
    let offsetY = 0;
    let originalParent = null;
    let originalNext = null;
    let activePointerId = null;

    el.addEventListener("pointerdown", startDrag);

    function startDrag(event){
        if (activePointerId !== null) return;

        event.preventDefault();
        draggingNow = true;
        activePointerId = event.pointerId;

        originalParent = el.parentElement;
        originalNext = el.nextSibling;

        const rect = el.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        el.classList.add("dragging");
        el.style.left = `${rect.left}px`;
        el.style.top = `${rect.top}px`;
        el.style.width = `${rect.width}px`;
        el.style.height = `${rect.height}px`;

        document.body.appendChild(el);
        el.setPointerCapture(activePointerId);

        el.addEventListener("pointermove", moveDrag);
        el.addEventListener("pointerup", endDrag);
        el.addEventListener("pointercancel", endDrag);
    }

    function moveDrag(event){
        if (event.pointerId !== activePointerId) return;

        el.style.left = `${event.clientX - offsetX}px`;
        el.style.top = `${event.clientY - offsetY}px`;
    }

    function endDrag(event){
        if (event.pointerId !== activePointerId) return;

        if (el.hasPointerCapture(activePointerId)){
            el.releasePointerCapture(activePointerId);
        }

        el.removeEventListener("pointermove", moveDrag);
        el.removeEventListener("pointerup", endDrag);
        el.removeEventListener("pointercancel", endDrag);

        const animal = el.dataset.animal;
        const target = document.getElementById(`shadow-${animal}`);
        const animalRect = el.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();

        const animalCenterX = animalRect.left + animalRect.width / 2;
        const animalCenterY = animalRect.top + animalRect.height / 2;
        const targetCenterX = targetRect.left + targetRect.width / 2;
        const targetCenterY = targetRect.top + targetRect.height / 2;

        const distance = Math.hypot(
            animalCenterX - targetCenterX,
            animalCenterY - targetCenterY
        );

        const matchDistance = Math.max(52, targetRect.width * 0.72);

        if (distance <= matchDistance){
            playSound("correctSound");
            target.classList.add("matched");
            target.src = el.src;
            el.remove();
            matched += 1;

            if (matched === animals.length){
                setTimeout(() => {
                    playSound("clapSound");
                    document.getElementById("win-screen").style.display = "flex";
                }, 450);
            }
        }else{
            playSound("wrongSound");
            el.classList.remove("dragging");
            el.removeAttribute("style");

            if (originalNext && originalNext.parentNode === originalParent){
                originalParent.insertBefore(el, originalNext);
            }else{
                originalParent.appendChild(el);
            }
        }

        draggingNow = false;
        activePointerId = null;
        setAppHeight();
    }
}

function resetGame(){
    createAnimals();
}
</script>

</body>
</html>
