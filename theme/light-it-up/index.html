<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Light It Up</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

font-family:Arial, sans-serif;

background:#eafaff;

}


/* SPLASH */

#splash{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

background:white;

z-index:1000;

}


#splash img{

width:min(60vw,400px);

animation:pulse 1.3s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.08);
}

}



/* GAME */

#game{

display:none;

height:100vh;

width:100%;

flex-direction:column;

background:
linear-gradient(
#c9f2ff,
#ffffff,
#e2f7d5
);

}



/* HEADER */

header{

height:65px;

background:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:10px 20px;

border-bottom:3px solid #65c7e5;

}


.title{

font-size:clamp(22px,3vw,36px);

font-weight:bold;

color:#13759b;

}



.score{

background:#fff2a6;

padding:8px 18px;

border-radius:30px;

font-weight:bold;

}



/* QUESTION */

.question{

text-align:center;

padding:8px;

}


.question h1{

margin:0;

font-size:clamp(24px,4vw,40px);

color:#163e58;

}



/* CARDS */


.area{

flex:1;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

}


.grid{

width:min(1100px,100%);

height:100%;

display:grid;

grid-template-columns:repeat(5,1fr);

gap:15px;

}



.card{

background:white;

border:4px solid white;

border-radius:25px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

cursor:pointer;

overflow:hidden;

box-shadow:
0 6px 15px rgba(0,0,0,.15);

position:relative;

}



.card img{

width:90%;

height:80%;

object-fit:contain;

}


.name{

font-size:clamp(15px,2vw,24px);

font-weight:bold;

color:#183c50;

padding:8px;

text-align:center;

}



/* STATES */

.correct{

border-color:#2ecc71;

background:#e5ffe9;

animation:pop .5s;

}


.wrong{

border-color:red;

animation:shake .4s;

}


.on{

filter:
drop-shadow(0 0 15px gold);

}



.symbol{

position:absolute;

top:8px;

right:8px;

font-size:35px;

}



@keyframes pop{

50%{
transform:scale(1.08);
}

}


@keyframes shake{

25%{
transform:translateX(-10px);
}

50%{
transform:translateX(10px);
}

75%{
transform:translateX(-5px);
}

}



/* FEEDBACK */


#feedback{

height:45px;

text-align:center;

font-size:28px;

font-weight:bold;

color:#187344;

}



/* END */


#end{

display:none;

height:100%;

align-items:center;

justify-content:center;

flex-direction:column;

text-align:center;

}


#end h1{

font-size:60px;

color:#1680a8;

}


button{

padding:15px 35px;

border:none;

border-radius:30px;

background:#1ca6d1;

color:white;

font-size:22px;

font-weight:bold;

}


/* TABLET */

@media(max-width:900px){

.grid{

grid-template-columns:repeat(3,1fr);

}


}



/* MOBILE */

@media(max-width:600px){

header{

height:55px;

padding:5px 10px;

}


.grid{

grid-template-columns:repeat(2,1fr);

gap:8px;

}


.card img{

height:75%;

}


.name{

font-size:15px;

}


}



</style>

</head>


<body>


<!-- LOGO -->

<div id="splash">

<img src="assets/innovine-logo.png">

</div>



<!-- GAME -->


<div id="game">


<header>

<div class="title">
💡 Light It Up
</div>


<div class="score">

⭐
<span id="count">0</span>/5

</div>


</header>



<div class="question">

<h1>
Tap the objects that work on electricity
</h1>

</div>



<div class="area">


<div class="grid" id="grid"></div>


</div>


<div id="feedback"></div>


</div>



<!-- END -->


<div id="end">

<h1>
🎉 Wonderful!
</h1>

<h2>
You found all the electric objects!
</h2>


<button onclick="restart()">
Play Again
</button>


</div>



<!-- AUDIO -->


<audio id="correct"
src="assets/correct.mp3">
</audio>


<audio id="wrong"
src="assets/wrong.mp3">
</audio>


<audio id="clap"
src="assets/claps.mp3">
</audio>




<script>


const objects=[


{
name:"Fan",
img:"assets/fan.png",
electric:true
},


{
name:"TV",
img:"assets/tv.png",
electric:true
},


{
name:"Lamp",
img:"assets/lamp.png",
electric:true
},


{
name:"AC",
img:"assets/ac.png",
electric:true
},


{
name:"Speaker",
img:"assets/speaker.png",
electric:true
},


{
name:"Ball",
img:"assets/ball.png",
electric:false
},


{
name:"Book",
img:"assets/book.png",
electric:false
},


{
name:"Pillow",
img:"assets/pillow.png",
electric:false
},


{
name:"Plant",
img:"assets/plant.png",
electric:false
}


];



let found=0;



const grid=document.getElementById("grid");



function shuffle(arr){

return arr.sort(()=>Math.random()-0.5);

}




function start(){

grid.innerHTML="";

found=0;

count.innerHTML=0;


shuffle(objects).forEach(obj=>{


let card=document.createElement("div");

card.className="card";


card.innerHTML=

`

<img src="${obj.img}">

<div class="name">
${obj.name}
</div>

<div class="symbol"></div>

`;



card.onclick=()=>{


if(obj.electric){


card.classList.add("correct");

card.querySelector(".symbol").innerHTML="⚡";

card.querySelector("img").classList.add("on");


document.getElementById("correct").play();


found++;

count.innerHTML=found;



card.onclick=null;



if(found===5){

setTimeout(finish,1000);

}



}


else{


card.classList.add("wrong");

card.querySelector(".symbol").innerHTML="❌";


document.getElementById("wrong").play();



setTimeout(()=>{

card.classList.remove("wrong");

card.querySelector(".symbol").innerHTML="";


},600);



}



};


grid.appendChild(card);



});


}





function finish(){


document.getElementById("game").style.display="none";


document.getElementById("end").style.display="flex";


document.getElementById("clap").play();


}



function restart(){

document.getElementById("end").style.display="none";

document.getElementById("game").style.display="flex";

start();

}



setTimeout(()=>{


document.getElementById("splash").style.display="none";


document.getElementById("game").style.display="flex";


start();


},5000);



</script>


</body>

</html>
