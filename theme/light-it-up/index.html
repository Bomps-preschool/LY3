<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Light It Up</title>

<style>

/* ================================
   BASIC SETTINGS
================================ */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial, sans-serif;

    background:#eafaff;
}


/* ================================
   SPLASH
================================ */

#splash{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

    z-index:1000;
}


#splash img{

    width:min(60vw,400px);

    max-height:70vh;

    object-fit:contain;

    animation:pulse 1.3s infinite;

}


@keyframes pulse{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}



/* ================================
   GAME
================================ */

#game{

    display:none;

    width:100%;

    height:100vh;
    height:100dvh;

    flex-direction:column;

    overflow:hidden;

    background:
    linear-gradient(
        #c9f2ff,
        #ffffff,
        #e2f7d5
    );

}



/* ================================
   HEADER
================================ */

header{

    flex-shrink:0;

    min-height:60px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:8px 20px;

    gap:10px;

    border-bottom:3px solid #65c7e5;

}


.title{

    font-size:clamp(20px,3vw,36px);

    font-weight:bold;

    color:#13759b;

}


.score{

    flex-shrink:0;

    background:#fff2a6;

    padding:8px 18px;

    border-radius:30px;

    font-weight:bold;

    font-size:clamp(16px,2vw,22px);

}



/* ================================
   QUESTION
================================ */

.question{

    flex-shrink:0;

    text-align:center;

    padding:7px 10px;

}


.question h1{

    margin:0;

    font-size:clamp(21px,3.5vw,40px);

    line-height:1.15;

    color:#163e58;

}



/* ================================
   GAME AREA
================================ */

.area{

    flex:1;

    min-height:0;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:8px 15px;

}



/* ================================
   GRID
================================ */

.grid{

    width:min(1100px,100%);

    height:100%;

    min-height:0;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    grid-template-rows:repeat(2,minmax(0,1fr));

    gap:12px;

}



/* ================================
   CARDS
================================ */

.card{

    min-width:0;

    min-height:0;

    background:white;

    border:4px solid white;

    border-radius:22px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
    0 6px 15px rgba(0,0,0,.15);

    position:relative;

    touch-action:manipulation;

}


.card img{

    width:88%;

    height:75%;

    min-height:0;

    object-fit:contain;

    pointer-events:none;

}


.name{

    flex-shrink:0;

    font-size:clamp(14px,1.8vw,23px);

    font-weight:bold;

    color:#183c50;

    padding:4px;

    text-align:center;

}



/* ================================
   STATES
================================ */

.correct{

    border-color:#2ecc71;

    background:#e5ffe9;

    animation:pop .5s;

}


.wrong{

    border-color:red;

    animation:shake .4s;

}


.on{

    filter:
    drop-shadow(0 0 10px gold)
    drop-shadow(0 0 15px gold);

}


.symbol{

    position:absolute;

    top:6px;

    right:7px;

    font-size:clamp(22px,3vw,35px);

}



@keyframes pop{

    50%{
        transform:scale(1.06);
    }

}



@keyframes shake{

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-5px);
    }

}



/* ================================
   FEEDBACK
================================ */

#feedback{

    flex-shrink:0;

    height:35px;

    text-align:center;

    font-size:clamp(18px,2.5vw,27px);

    font-weight:bold;

    color:#187344;

}



/* ================================
   END SCREEN
================================ */

#end{

    position:fixed;

    inset:0;

    width:100%;

    height:100vh;
    height:100dvh;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    padding:20px;

    background:
    linear-gradient(
        #c9f2ff,
        #ffffff,
        #e2f7d5
    );

    z-index:999;

}


#end h1{

    margin:0 0 10px;

    font-size:clamp(42px,8vw,70px);

    color:#1680a8;

}


#end h2{

    margin:0 0 30px;

    font-size:clamp(20px,4vw,32px);

    color:#163e58;

}



/* ================================
   BUTTON
================================ */

button{

    padding:15px 35px;

    border:none;

    border-radius:30px;

    background:#1ca6d1;

    color:white;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    touch-action:manipulation;

}



/* ================================
   TABLET
================================ */

@media(max-width:900px){

    .grid{

        grid-template-columns:repeat(3,1fr);

        grid-template-rows:repeat(3,minmax(0,1fr));

        gap:9px;

    }

}



/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    header{

        min-height:50px;

        padding:5px 8px;

    }


    .title{

        font-size:19px;

    }


    .score{

        padding:6px 10px;

        font-size:15px;

    }


    .question{

        padding:5px;

    }


    .question h1{

        font-size:20px;

    }


    .area{

        padding:5px 7px;

    }


    .grid{

        grid-template-columns:repeat(3,1fr);

        grid-template-rows:repeat(3,minmax(0,1fr));

        gap:6px;

    }


    .card{

        border-width:3px;

        border-radius:14px;

    }


    .card img{

        width:85%;

        height:72%;

    }


    .name{

        font-size:13px;

        padding:2px;

    }


    .symbol{

        font-size:20px;

        top:3px;

        right:4px;

    }


    #feedback{

        height:27px;

        font-size:17px;

    }

}



/* ================================
   VERY SMALL MOBILE
================================ */

@media(max-width:380px){

    .title{

        font-size:17px;

    }


    .score{

        font-size:14px;

    }


    .question h1{

        font-size:18px;

    }


    .name{

        font-size:11px;

    }

}



/* ================================
   MOBILE LANDSCAPE
================================ */

@media(
orientation:landscape
)
and
(max-height:600px){

    header{

        min-height:45px;

        padding:3px 10px;

    }


    .title{

        font-size:18px;

    }


    .score{

        padding:4px 10px;

        font-size:14px;

    }


    .question{

        padding:2px;

    }


    .question h1{

        font-size:18px;

    }


    .area{

        padding:3px 8px;

    }


    .grid{

        grid-template-columns:repeat(5,1fr);

        grid-template-rows:repeat(2,minmax(0,1fr));

        gap:6px;

    }


    .card{

        border-radius:12px;

        border-width:3px;

    }


    .card img{

        height:68%;

    }


    .name{

        font-size:12px;

        padding:1px;

    }


    #feedback{

        height:22px;

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- ================================
     SPLASH
================================ -->

<div id="splash">

<img
src="assets/innovine-logo.png"
alt="Innovine">

</div>



<!-- ================================
     GAME
================================ -->

<div id="game">


<header>


<div class="title">

💡 Light It Up

</div>


<div class="score">

⭐
<span id="count">0</span>/5

</div>


</header>



<div class="question">

<h1>
Tap the objects that work on electricity
</h1>

</div>



<div class="area">

<div
class="grid"
id="grid">
</div>

</div>



<div id="feedback"></div>


</div>



<!-- ================================
     END SCREEN
================================ -->

<div id="end">


<h1>
🎉 Wonderful!
</h1>


<h2>
You found all the electric objects!
</h2>


<button
type="button"
onclick="restart()">

Play Again

</button>


</div>



<!-- ================================
     AUDIO
================================ -->

<audio
id="correctSound"
src="assets/correct.mp3"
preload="auto">
</audio>


<audio
id="wrongSound"
src="assets/wrong.mp3"
preload="auto">
</audio>


<audio
id="clapSound"
src="assets/claps.mp3"
preload="auto">
</audio>



<script>


/* ================================
   GAME OBJECTS
================================ */

const objects=[


{
name:"Fan",
img:"assets/fan.png",
electric:true
},


{
name:"TV",
img:"assets/tv.png",
electric:true
},


{
name:"Lamp",
img:"assets/lamp.png",
electric:true
},


{
name:"AC",
img:"assets/ac.png",
electric:true
},


{
name:"Speaker",
img:"assets/speaker.png",
electric:true
},


{
name:"Ball",
img:"assets/ball.png",
electric:false
},


{
name:"Book",
img:"assets/book.png",
electric:false
},


{
name:"Pillow",
img:"assets/pillow.png",
electric:false
},


{
name:"Plant",
img:"assets/plant.png",
electric:false
}


];



let found=0;

let gameFinished=false;



const grid=
document.getElementById("grid");


const count=
document.getElementById("count");


const feedback=
document.getElementById("feedback");


const game=
document.getElementById("game");


const end=
document.getElementById("end");


const splash=
document.getElementById("splash");


const correctSound=
document.getElementById("correctSound");


const wrongSound=
document.getElementById("wrongSound");


const clapSound=
document.getElementById("clapSound");



/* ================================
   SOUND
================================ */

function playAudio(audio){

    try{

        audio.pause();

        audio.currentTime=0;

        audio.play().catch(function(){});

    }

    catch(e){}

}



/* ================================
   SHUFFLE
================================ */

function shuffle(arr){

    const copy=[...arr];


    for(
        let i=copy.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            Math.random()*(i+1)
        );


        const temp=copy[i];

        copy[i]=copy[j];

        copy[j]=temp;

    }


    return copy;

}



/* ================================
   START GAME
================================ */

function start(){


    grid.innerHTML="";


    found=0;


    gameFinished=false;


    count.textContent="0";


    feedback.textContent="";


    const shuffledObjects=
    shuffle(objects);



    shuffledObjects.forEach(function(obj){


        const card=
        document.createElement("div");


        card.className="card";



        card.innerHTML=

        `

        <img
        src="${obj.img}"
        alt="${obj.name}"
        draggable="false">

        <div class="name">
        ${obj.name}
        </div>

        <div class="symbol"></div>

        `;



        let selected=false;



        card.onclick=function(){


            if(gameFinished){

                return;

            }


            if(obj.electric){


                if(selected){

                    return;

                }


                selected=true;



                card.classList.add(
                    "correct"
                );


                card.querySelector(
                    ".symbol"
                ).textContent="⚡";


                card.querySelector(
                    "img"
                ).classList.add(
                    "on"
                );


                feedback.textContent=
                "Good job!";


                playAudio(
                    correctSound
                );



                found++;


                count.textContent=
                found;



                if(found===5){


                    gameFinished=true;


                    feedback.textContent=
                    "Excellent!";


                    setTimeout(
                        finish,
                        800
                    );

                }


            }


            else{


                card.classList.remove(
                    "wrong"
                );


                void card.offsetWidth;


                card.classList.add(
                    "wrong"
                );


                card.querySelector(
                    ".symbol"
                ).textContent="❌";


                feedback.textContent=
                "Try again!";


                playAudio(
                    wrongSound
                );



                setTimeout(
                    function(){


                        card.classList.remove(
                            "wrong"
                        );


                        card.querySelector(
                            ".symbol"
                        ).textContent="";


                        feedback.textContent="";


                    },
                    600
                );


            }


        };



        grid.appendChild(card);


    });


}



/* ================================
   FINISH GAME
================================ */

function finish(){


    game.style.display=
    "none";


    end.style.display=
    "flex";


    playAudio(
        clapSound
    );


}



/* ================================
   PLAY AGAIN
================================ */

function restart(){


    end.style.display=
    "none";


    game.style.display=
    "flex";


    start();


}



/* ================================
   SPLASH SCREEN
================================ */

setTimeout(
function(){


    splash.style.display=
    "none";


    end.style.display=
    "none";


    game.style.display=
    "flex";


    start();


},
5000
);


</script>


</body>

</html>
