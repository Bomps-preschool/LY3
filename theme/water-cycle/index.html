<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Water Cycle Game</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #dff7ff;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
}

button {
  font-family: inherit;
}

/* =========================
   SPLASH SCREEN
========================= */

#splash {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #ffffff;
}

#splash img {
  width: min(65vw, 430px);
  max-height: 55vh;
  object-fit: contain;

  animation: logoPulse 1.4s ease-in-out infinite;
}

@keyframes logoPulse {
  0%,
  100% {
    transform: scale(0.95);
  }

  50% {
    transform: scale(1.05);
  }
}

/* =========================
   GAME
========================= */

#game {
  display: none;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  flex-direction: column;

  overflow: hidden;

  background:
    linear-gradient(
      to bottom,
      #bfeeff 0%,
      #eefcff 62%,
      #dcf4cf 100%
    );
}

/* =========================
   HEADER
========================= */

header {
  flex: 0 0 auto;

  min-height: 64px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 8px 18px;

  background: rgba(255, 255, 255, 0.96);

  border-bottom: 3px solid #73cee7;
}

.title {
  display: flex;
  align-items: center;
  gap: 8px;

  color: #176f98;

  font-size: clamp(21px, 3vw, 34px);
  font-weight: bold;
}

.counter {
  padding: 7px 14px;

  border-radius: 25px;

  background: #fff0a3;

  border: 2px solid #edc945;

  color: #554200;

  font-size: clamp(14px, 2vw, 20px);
  font-weight: bold;
}

/* =========================
   QUESTION
========================= */

.question-box {
  flex: 0 0 auto;

  text-align: center;

  padding: 8px 10px 5px;
}

.small-text {
  margin: 0 0 3px;

  color: #506b75;

  font-size: clamp(13px, 1.8vw, 18px);

  font-weight: bold;
}

#question {
  margin: 0;

  color: #183e56;

  font-size: clamp(24px, 3.5vw, 40px);

  font-weight: 900;
}

/* =========================
   CARDS
========================= */

.card-area {
  flex: 1 1 auto;

  min-height: 0;

  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 8px 18px;
}

#cards {
  width: min(1120px, 100%);
  height: 100%;

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 16px;
}

.card {
  position: relative;

  min-width: 0;
  min-height: 0;

  padding: 0;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border: 4px solid white;

  border-radius: 22px;

  background: white;

  box-shadow:
    0 5px 0 rgba(62, 143, 170, 0.17),
    0 7px 18px rgba(0, 0, 0, 0.1);

  cursor: pointer;
}

.card:active {
  transform: scale(0.97);
}

.image-wrap {
  flex: 1 1 auto;

  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 7px;
}

.card img {
  width: 100%;
  height: 100%;

  max-height: 310px;

  object-fit: contain;
}

.label {
  flex: 0 0 auto;

  width: 100%;

  padding: 10px 5px;

  background: #ffffff;

  border-top: 2px solid #dceff5;

  color: #153f58;

  text-align: center;

  font-size: clamp(17px, 2vw, 25px);
  font-weight: 900;
}

/* =========================
   SYMBOL
========================= */

.symbol {
  display: none;

  position: absolute;

  top: 7px;
  right: 7px;

  width: 50px;
  height: 50px;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: white;

  font-size: 32px;
  font-weight: bold;

  z-index: 10;
}

/* =========================
   CORRECT
========================= */

.card.correct {
  border-color: #2eba60;
  background: #e0f9e8;

  animation: correctPop 0.4s ease;
}

.card.correct .symbol {
  display: flex;
  background: #2eba60;
}

@keyframes correctPop {
  50% {
    transform: scale(1.06);
  }
}

/* =========================
   WRONG
========================= */

.card.wrong {
  border-color: #ed5151;
  background: #ffe1e1;

  animation: shake 0.35s ease;
}

.card.wrong .symbol {
  display: flex;
  background: #ed5151;
}

@keyframes shake {
  0%,
  100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-8px);
  }

  50% {
    transform: translateX(8px);
  }

  75% {
    transform: translateX(-5px);
  }
}

/* =========================
   HINT
========================= */

.card.hint {
  border-color: #ffb400;

  animation: hintGlow 0.7s infinite alternate;
}

@keyframes hintGlow {
  from {
    box-shadow:
      0 0 0 2px rgba(255, 180, 0, 0.3),
      0 6px 15px rgba(0, 0, 0, 0.1);
  }

  to {
    box-shadow:
      0 0 0 8px rgba(255, 180, 0, 0.4),
      0 6px 15px rgba(0, 0, 0, 0.1);
  }
}

/* =========================
   FEEDBACK
========================= */

#feedback {
  flex: 0 0 auto;

  min-height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 10px 7px;

  color: #17623e;

  text-align: center;

  font-size: clamp(18px, 2.5vw, 28px);
  font-weight: 900;
}

/* =========================
   END SCREEN
========================= */

#endScreen {
  display: none;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  padding: 20px;

  text-align: center;

  background:
    linear-gradient(
      to bottom,
      #bfefff,
      #ffffff,
      #daf5ce
    );
}

.end-icon {
  font-size: clamp(80px, 14vw, 145px);
}

.end-title {
  margin: 10px 0 5px;

  color: #19799f;

  font-size: clamp(34px, 5vw, 58px);
  font-weight: 900;
}

.end-text {
  margin: 5px 0 25px;

  color: #365d6b;

  font-size: clamp(19px, 2.8vw, 29px);
  font-weight: bold;
}

#playAgain {
  border: none;

  border-radius: 30px;

  padding: 14px 30px;

  background: #27a8d0;

  color: white;

  font-size: clamp(19px, 2.5vw, 26px);
  font-weight: bold;

  cursor: pointer;

  box-shadow: 0 6px 0 #147691;
}

/* =========================
   TABLET / PHONE
========================= */

@media (max-width: 900px) {

  #cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));

    gap: 10px;
  }

  .card img {
    max-height: 190px;
  }
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 520px) {

  header {
    min-height: 52px;
    padding: 5px 8px;
  }

  .title {
    font-size: 20px;
  }

  .counter {
    padding: 5px 8px;
    font-size: 13px;
  }

  .question-box {
    padding: 5px 6px 2px;
  }

  .small-text {
    font-size: 12px;
  }

  #question {
    font-size: 21px;
  }

  .card-area {
    padding: 5px 7px;
  }

  #cards {
    gap: 7px;
  }

  .card {
    border-width: 3px;
    border-radius: 15px;
  }

  .image-wrap {
    padding: 3px;
  }

  .card img {
    max-height: 145px;
  }

  .label {
    padding: 6px 2px;
    font-size: 14px;
  }

  #feedback {
    min-height: 34px;
    padding-bottom: 3px;
    font-size: 17px;
  }

  .symbol {
    width: 35px;
    height: 35px;

    top: 4px;
    right: 4px;

    font-size: 23px;
  }
}

/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) and (max-height: 620px) {

  header {
    min-height: 45px;
    padding: 3px 10px;
  }

  .title {
    font-size: 19px;
  }

  .question-box {
    padding: 2px 6px;
  }

  .small-text {
    display: none;
  }

  #question {
    font-size: 20px;
  }

  #cards {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: 1fr;
  }

  .card img {
    max-height: 150px;
  }

  .label {
    font-size: 14px;
    padding: 5px 2px;
  }

  #feedback {
    min-height: 28px;
    font-size: 15px;
    padding: 0;
  }
}

</style>
</head>

<body>

<!-- =========================
     SPLASH SCREEN
========================= -->

<div id="splash">

  <img
    src="assets/innovine-logo.png"
    alt="Innovine Logo"
  >

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

  <header>

    <div class="title">
      💧 Water Cycle
    </div>

    <div class="counter">
      ⭐
      <span id="questionNumber">1</span>
      /
      <span id="totalQuestions">8</span>
    </div>

  </header>


  <section class="question-box">

    <p class="small-text">
      Look carefully and tap the correct picture.
    </p>

    <h1 id="question">
      Tap Evaporation
    </h1>

  </section>


  <main class="card-area">

    <div id="cards"></div>

  </main>


  <div
    id="feedback"
    aria-live="polite"
  ></div>

</div>


<!-- =========================
     END SCREEN
========================= -->

<div id="endScreen">

  <div class="end-icon">
    🌈💧
  </div>

  <div class="end-title">
    Wonderful!
  </div>

  <div class="end-text">
    You completed the water cycle!
  </div>

  <button
    id="playAgain"
    type="button"
  >
    Play Again
  </button>

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
  id="correctSound"
  src="assets/correct.mp3"
  preload="auto"
></audio>

<audio
  id="wrongSound"
  src="assets/wrong.mp3"
  preload="auto"
></audio>

<audio
  id="clapSound"
  src="assets/claps.mp3"
  preload="auto"
></audio>


<script>

/* =====================================================
   EXACT FILE NAMES FROM YOUR GITHUB ASSETS FOLDER
===================================================== */

const stages = [

  {
    id: "evaporation",
    name: "Evaporation",
    image: "assets/evaporation.png"
  },

  {
    id: "condensation",
    name: "Condensation",
    image: "assets/condensation.png"
  },

  {
    id: "precipitation",
    name: "Precipitation",

    /* Your GitHub file is spelt percipitation.png */
    image: "assets/percipitation.png"
  },

  {
    id: "collection",
    name: "Collection",
    image: "assets/collection.png"
  }

];


/* =====================================================
   QUESTIONS
===================================================== */

const questionBank = [

  "evaporation",
  "condensation",
  "precipitation",
  "collection",

  "precipitation",
  "evaporation",
  "collection",
  "condensation"

];


/* =====================================================
   GAME VARIABLES
===================================================== */

let questions = [];

let currentIndex = 0;

let wrongCount = 0;

let locked = false;


/* =====================================================
   ELEMENTS
===================================================== */

const splash =
  document.getElementById("splash");

const game =
  document.getElementById("game");

const cards =
  document.getElementById("cards");

const question =
  document.getElementById("question");

const feedback =
  document.getElementById("feedback");

const questionNumber =
  document.getElementById("questionNumber");

const totalQuestions =
  document.getElementById("totalQuestions");

const endScreen =
  document.getElementById("endScreen");

const playAgain =
  document.getElementById("playAgain");

const correctSound =
  document.getElementById("correctSound");

const wrongSound =
  document.getElementById("wrongSound");

const clapSound =
  document.getElementById("clapSound");


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

  const newArray = [...array];


  for (
    let i = newArray.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      newArray[i],
      newArray[j]
    ] = [
      newArray[j],
      newArray[i]
    ];

  }


  return newArray;
}


/* =====================================================
   AUDIO
===================================================== */

function playSound(audio) {

  if (!audio) {
    return;
  }


  try {

    audio.pause();

    audio.currentTime = 0;


    const result =
      audio.play();


    if (
      result &&
      typeof result.catch === "function"
    ) {

      result.catch(function () {
        /* Do nothing if browser blocks audio */
      });

    }

  }
  catch (error) {

    console.log(
      "Audio error:",
      error
    );

  }

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  questions =
    shuffle(questionBank);


  currentIndex = 0;

  wrongCount = 0;

  locked = false;


  totalQuestions.textContent =
    questions.length;


  endScreen.style.display =
    "none";


  game.style.display =
    "flex";


  showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

  locked = false;

  wrongCount = 0;


  feedback.textContent =
    "";


  const correctId =
    questions[currentIndex];


  const correctStage =
    stages.find(
      function (stage) {

        return (
          stage.id ===
          correctId
        );

      }
    );


  questionNumber.textContent =
    currentIndex + 1;


  question.textContent =
    "Tap " +
    correctStage.name;


  makeCards();

}


/* =====================================================
   CREATE CARDS
===================================================== */

function makeCards() {

  cards.innerHTML =
    "";


  const mixedStages =
    shuffle(stages);


  mixedStages.forEach(
    function (stage) {


      const card =
        document.createElement(
          "button"
        );


      card.type =
        "button";


      card.className =
        "card";


      card.dataset.stage =
        stage.id;


      card.setAttribute(
        "aria-label",
        stage.name
      );


      /* IMAGE HOLDER */

      const imageWrap =
        document.createElement(
          "div"
        );


      imageWrap.className =
        "image-wrap";


      /* IMAGE */

      const img =
        document.createElement(
          "img"
        );


      img.src =
        stage.image;


      img.alt =
        stage.name;


      img.draggable =
        false;


      /*
      If an image cannot be found,
      show a simple fallback.
      */

      img.addEventListener(
        "error",
        function () {

          img.style.display =
            "none";


          imageWrap.style.fontSize =
            "80px";


          if (
            stage.id ===
            "evaporation"
          ) {

            imageWrap.textContent =
              "☀️";

          }

          else if (
            stage.id ===
            "condensation"
          ) {

            imageWrap.textContent =
              "☁️";

          }

          else if (
            stage.id ===
            "precipitation"
          ) {

            imageWrap.textContent =
              "🌧️";

          }

          else {

            imageWrap.textContent =
              "🌊";

          }

        }
      );


      imageWrap.appendChild(
        img
      );


      /* LABEL */

      const label =
        document.createElement(
          "div"
        );


      label.className =
        "label";


      label.textContent =
        stage.name;


      /* TICK / CROSS */

      const symbol =
        document.createElement(
          "div"
        );


      symbol.className =
        "symbol";


      card.appendChild(
        imageWrap
      );


      card.appendChild(
        label
      );


      card.appendChild(
        symbol
      );


      card.addEventListener(
        "click",
        function () {

          checkAnswer(
            card,
            stage.id
          );

        }
      );


      cards.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
  clickedCard,
  selectedAnswer
) {

  if (locked) {
    return;
  }


  const correctAnswer =
    questions[currentIndex];


  /* =============================
     CORRECT
  ============================= */

  if (
    selectedAnswer ===
    correctAnswer
  ) {

    locked = true;


    removeHints();


    clickedCard.classList.add(
      "correct"
    );


    const symbol =
      clickedCard.querySelector(
        ".symbol"
      );


    symbol.textContent =
      "✓";


    feedback.textContent =
      "Good job!";


    playSound(
      correctSound
    );


    const allCards =
      document.querySelectorAll(
        ".card"
      );


    allCards.forEach(
      function (card) {

        card.disabled =
          true;

      }
    );


    setTimeout(
      function () {

        currentIndex++;


        if (
          currentIndex >=
          questions.length
        ) {

          finishGame();

        }

        else {

          showQuestion();

        }

      },
      1200
    );

  }


  /* =============================
     WRONG
  ============================= */

  else {

    wrongCount++;


    clickedCard.classList.remove(
      "wrong"
    );


    /*
    Force browser to restart
    shake animation.
    */

    void clickedCard.offsetWidth;


    clickedCard.classList.add(
      "wrong"
    );


    const symbol =
      clickedCard.querySelector(
        ".symbol"
      );


    symbol.textContent =
      "×";


    feedback.textContent =
      "Try again!";


    playSound(
      wrongSound
    );


    setTimeout(
      function () {

        clickedCard.classList.remove(
          "wrong"
        );


        symbol.textContent =
          "";

      },
      650
    );


    /*
    Hint after two wrong attempts.
    */

    if (
      wrongCount >= 2
    ) {

      feedback.textContent =
        "Look at the glowing picture!";


      showHint(
        correctAnswer
      );

    }

  }

}


/* =====================================================
   HINT
===================================================== */

function showHint(
  correctAnswer
) {

  const allCards =
    document.querySelectorAll(
      ".card"
    );


  allCards.forEach(
    function (card) {

      if (
        card.dataset.stage ===
        correctAnswer
      ) {

        card.classList.add(
          "hint"
        );

      }

    }
  );

}


/* =====================================================
   REMOVE HINT
===================================================== */

function removeHints() {

  const allCards =
    document.querySelectorAll(
      ".card"
    );


  allCards.forEach(
    function (card) {

      card.classList.remove(
        "hint"
      );

    }
  );

}


/* =====================================================
   FINISH
===================================================== */

function finishGame() {

  game.style.display =
    "none";


  endScreen.style.display =
    "flex";


  playSound(
    clapSound
  );

}


/* =====================================================
   PLAY AGAIN
===================================================== */

playAgain.addEventListener(
  "click",
  function () {

    startGame();

  }
);


/* =====================================================
   SPLASH SCREEN

   Do NOT wait for window.load.
   Timer starts immediately.

   This avoids the game getting stuck if
   an image or audio file loads slowly.
===================================================== */

setTimeout(
  function () {

    splash.style.display =
      "none";


    startGame();

  },
  5000
);

</script>

</body>
</html>
